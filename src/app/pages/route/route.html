<div class="route-page">

  <!-- MAPA -->
  <div id="route-map"></div>

  <!-- PANEL -->
  <div class="route-panel">

    <h2>
      🗺️ {{ currentPlace?.name }}
    </h2>

    <div class="stats">

      <div class="stat-card">
        📏 {{ distance }}
      </div>

      <div class="stat-card">
        ⏱️ {{ duration }}
      </div>

    </div>

    <!-- MODOS -->
    <div class="modes">

      <button
        [class.active]="travelMode === 'foot-walking'"
        [disabled]="loading"
        (click)="changeMode('foot-walking')">

        🚶 Caminar

      </button>

      <button
        [class.active]="travelMode === 'driving-car'"
        [disabled]="loading"
        (click)="changeMode('driving-car')">

        🚗 Carro

      </button>

      <button
        [class.active]="travelMode === 'cycling-regular'"
        [disabled]="loading"
        (click)="changeMode('cycling-regular')">

        🏍️ Moto

      </button>

    </div>

    <!-- LOADING -->
    <div
      class="loading"
      *ngIf="loading">

      Calculando ruta...

    </div>

    <!-- GOOGLE -->
    <button
      class="google-btn"
      (click)="openGoogleMaps()">

      Abrir en Google Maps

    </button>

  </div>

</div>
